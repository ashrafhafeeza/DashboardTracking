<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Tracking CS SKS - Multi Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-6">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- HEADER -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl font-bold text-slate-900">Dashboard Tracking CS SKS</h1>
          <span class="bg-blue-100 text-blue-700 text-xs font-semibold px-2.5 py-1 rounded-full">Bulan: Juli</span>
        </div>
        <p class="text-slate-500 text-sm mt-1">Real-time update dari Google Sheets Sekolah</p>
      </div>
      
      <div class="flex gap-3 items-center">
        <label for="csFilter" id="filterLabel" class="text-sm font-medium text-slate-600">Filter CS:</label>
        <select id="csFilter" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="ALL">Semua Data</option>
        </select>
        <button onclick="fetchData()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg text-sm font-medium transition">
          🔄 Sync Data
        </button>
      </div>
    </header>

    <!-- NAVIGASI MENU TAB -->
    <div class="flex border-b border-slate-200 bg-white rounded-xl p-1 shadow-sm gap-1">
      <button onclick="switchTab('report_leads')" id="tab-report_leads" class="tab-btn flex-1 py-2.5 px-4 text-center rounded-lg font-medium text-sm transition bg-blue-600 text-white shadow">
        1. Report Leads
      </button>
      <button onclick="switchTab('rekap_cmb')" id="tab-rekap_cmb" class="tab-btn flex-1 py-2.5 px-4 text-center rounded-lg font-medium text-sm transition text-slate-600 hover:bg-slate-100">
        2. Rekapitulasi CMB
      </button>
      <button onclick="switchTab('rekap_murid')" id="tab-rekap_murid" class="tab-btn flex-1 py-2.5 px-4 text-center rounded-lg font-medium text-sm transition text-slate-600 hover:bg-slate-100">
        3. Rekapitulasi Murid
      </button>
    </div>

    <!-- METRICS -->
    <div id="metricsContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Kartu Metrik Diisi Dinamis -->
    </div>

    <!-- GRAFIK PIE -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 id="chartTitle" class="text-lg font-semibold mb-4">📊 Persentase & Distribusi Data</h2>
      <div class="relative h-80 w-full flex justify-center items-center">
        <canvas id="mainChart"></canvas>
      </div>
    </div>

    <!-- CONTAINER TABEL DINAMIS -->
    <div id="dynamicTableContainer" class="space-y-6">
      <!-- Diisi oleh JS -->
    </div>

  </div>

  <script>
    const SPREADSHEET_ID = '1QoN0mdOEU_E3oxbMkaSI_D6zSwyWRPhsaQj0tLMO8bQ';
    const GID = '1081523478';
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json;responseHandler:handleGoogleResponse&gid=${GID}`;

    let rawRows = [];
    let currentTab = 'report_leads';
    let chartInstance = null;

    function fetchData() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = GVIZ_URL;
        script.onerror = () => reject(new Error('Google Sheets tidak dapat diakses.'));

        window.handleGoogleResponse = (json) => {
          try {
            if (json.status !== 'ok') throw new Error('Respons Google Sheets tidak valid.');
            rawRows = json.table.rows;
            renderCurrentMenu();
            resolve();
          } catch (err) {
            reject(err);
          } finally {
            script.remove();
          }
        };

        document.head.appendChild(script);
      }).catch((err) => {
        console.error("Gagal mengambil data:", err);
        document.getElementById('dynamicTableContainer').innerHTML =
          `<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center text-red-500 font-semibold">Gagal terhubung: ${err.message}</div>`;
      });
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white', 'shadow');
        btn.classList.add('text-slate-600', 'hover:bg-slate-100');
      });

      const activeBtn = document.getElementById(`tab-${tabName}`);
      activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow');
      activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');

      renderCurrentMenu();
    }

    function renderCurrentMenu() {
      if (!rawRows || rawRows.length === 0) return;

      if (currentTab === 'report_leads') {
        renderReportLeads();
      } else if (currentTab === 'rekap_cmb') {
        renderRekapCMB();
      } else if (currentTab === 'rekap_murid') {
        renderRekapMurid();
      }
    }

    // --- MENU 1: REPORT LEADS ---
    function renderReportLeads() {
      document.getElementById('filterLabel').textContent = "Filter CS:";
      document.getElementById('chartTitle').textContent = "📊 Distribusi Status Leads";
      let data = [];
      let currentDate = '';

      for (let i = 0; i < rawRows.length; i++) {
        const c = rawRows[i].c;
        if (!c || !c[1]) continue;

        if (c[0]) currentDate = c[0].f || c[0].v || currentDate;
        const dateVal = currentDate;
        const namaCS = String(c[1].v || '-').trim();

        if (isJuly(dateVal)) {
          data.push({
            tanggal: dateVal,
            namaCS: namaCS,
            newLeads: c[2] ? (c[2].v || 0) : 0,
            existingLeads: c[3] ? (c[3].v || 0) : 0,
            totalLeads: c[4] ? (c[4].v || 0) : 0,
            callIn: c[5] ? (c[5].v || 0) : 0,
            potensial: c[6] ? (c[6].v || 0) : 0,
            closingForm: c[7] ? (c[7].v || 0) : 0,
            tidakPotensial: c[8] ? (c[8].v || 0) : 0,
            kuotaFull: c[9] ? (c[9].v || 0) : 0,
            closingUP: c[10] ? (c[10].v || 0) : 0
          });
        }
      }

      populateFilter(data, 'namaCS');
      const selectedCS = document.getElementById('csFilter').value;
      const filteredData = (selectedCS === 'ALL') ? data : data.filter(d => d.namaCS === selectedCS);

      const totalLead = filteredData.reduce((s, d) => s + d.totalLeads, 0);
      const totalPotensial = filteredData.reduce((s, d) => s + d.potensial, 0);
      const totalClosing = filteredData.reduce((s, d) => s + d.closingForm, 0);

      document.getElementById('metricsContainer').innerHTML = `
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-blue-500">
          <p class="text-sm font-medium text-slate-500">Total Leads (Juli)</p>
          <p class="text-3xl font-bold text-slate-900 mt-2">${totalLead.toLocaleString('id-ID')}</p>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-yellow-500">
          <p class="text-sm font-medium text-slate-500">Potensial (Follow Up)</p>
          <p class="text-3xl font-bold text-slate-900 mt-2">${totalPotensial.toLocaleString('id-ID')}</p>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-green-500">
          <p class="text-sm font-medium text-slate-500">Closing Form (Converted)</p>
          <p class="text-3xl font-bold text-slate-900 mt-2">${totalClosing.toLocaleString('id-ID')}</p>
        </div>
      `;

      let tableHTML = `
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <h2 class="text-lg font-semibold mb-4">📋 Laporan Detail Leads</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                  <th class="p-3">Tanggal</th>
                  <th class="p-3">Nama CS</th>
                  <th class="p-3">New Leads</th>
                  <th class="p-3">Existing</th>
                  <th class="p-3">Total Leads</th>
                  <th class="p-3">Potensial</th>
                  <th class="p-3">Closing Form</th>
                  <th class="p-3">Closing UP</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-sm">`;

      filteredData.forEach(item => {
        tableHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-3 text-slate-500">${item.tanggal}</td>
            <td class="p-3 font-medium text-slate-900">${item.namaCS}</td>
            <td class="p-3 text-slate-600">${item.newLeads}</td>
            <td class="p-3 text-slate-600">${item.existingLeads}</td>
            <td class="p-3 font-semibold text-blue-600">${item.totalLeads}</td>
            <td class="p-3 font-semibold text-yellow-600">${item.potensial}</td>
            <td class="p-3 font-semibold text-green-600">${item.closingForm}</td>
            <td class="p-3 font-semibold text-purple-600">${item.closingUP}</td>
          </tr>`;
      });

      tableHTML += `</tbody></table></div></div>`;
      document.getElementById('dynamicTableContainer').innerHTML = tableHTML;

      const totalPot = filteredData.reduce((s, d) => s + d.potensial, 0);
      const totalClose = filteredData.reduce((s, d) => s + d.closingForm, 0);
      const totalTidakPot = filteredData.reduce((s, d) => s + d.tidakPotensial, 0);
      const totalFull = filteredData.reduce((s, d) => s + d.kuotaFull, 0);
      const totalUP = filteredData.reduce((s, d) => s + d.closingUP, 0);

      renderPieChart(
        ['Potensial', 'Closing Form', 'Tidak Potensial', 'Kuota Full', 'Closing UP'],
        [totalPot, totalClose, totalTidakPot, totalFull, totalUP],
        ['#EAB308', '#22C55E', '#EF4444', '#64748B', '#A855F7']
      );
    }

    // --- MENU 2: REKAPITULASI CMB (MATRIKS REKAP DARI GAMBAR CONTOH) ---
    function renderRekapCMB() {
      document.getElementById('filterLabel').textContent = "Filter Unit:";
      document.getElementById('chartTitle').textContent = "📊 Distribusi CMB Per Jenjang";
      
      let rawData = [];
      let currentUnit = '';
      let currentJenjang = '';

      for (let i = 1; i < rawRows.length; i++) {
        const c = rawRows[i].c;
        if (!c) continue;

        if (c[15]?.v) currentUnit = String(c[15].v).trim();
        if (c[16]?.v) currentJenjang = String(c[16].v).trim();
        if (!c[17] || !c[18]) continue;
        const program = String(c[17].v || '').trim();
        const total = Number(c[18].v) || 0;

        if (program && program !== 'Program' && program !== 'Jumlah') {
          rawData.push({
            unit: currentUnit || 'Umum',
            jenjang: currentJenjang || 'Lainnya',
            program,
            totalCMB: total
          });
        }
      }

      populateFilter(rawData, 'unit');
      const selectedUnit = document.getElementById('csFilter').value;
      const data = (selectedUnit === 'ALL') ? rawData : rawData.filter(d => d.unit === selectedUnit);

      const totalCMB = data.reduce((s, d) => s + d.totalCMB, 0);
      const units = [...new Set(data.map(d => d.unit))];
      const jenjangs = [...new Set(data.map(d => d.jenjang))];
      const programs = [...new Set(data.map(d => d.program))];

      document.getElementById('metricsContainer').innerHTML = `
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-green-500">
          <p class="text-sm font-medium text-slate-500">Total CMB</p>
          <p class="text-3xl font-bold text-slate-900 mt-2">${totalCMB.toLocaleString('id-ID')}</p>
        </div>
      `;

      let htmlContainer = '';

      // 1. TABEL RINGKASAN: REKAP PER PROGRAM (SELURUH JENJANG)
      htmlContainer += `
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="bg-emerald-700 text-white font-bold text-sm py-2 px-4 rounded-t-lg">
            REKAP CMB PER PROGRAM (SELURUH JENJANG)
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-center border-collapse border border-slate-200 text-sm">
              <thead>
                <tr class="bg-blue-900 text-white font-bold">
                  <th class="p-2.5 border border-blue-950 text-left">Program</th>
                  ${jenjangs.map(j => `<th class="p-2.5 border border-blue-950">${j}</th>`).join('')}
                  <th class="p-2.5 border border-blue-950 bg-blue-950">TOTAL</th>
                </tr>
              </thead>
              <tbody>`;

      let jenjangTotals = Array(jenjangs.length).fill(0);

      programs.forEach(prog => {
        let pSum = 0;
        htmlContainer += `<tr class="hover:bg-slate-50"><td class="p-2 border border-slate-200 font-bold text-left bg-slate-50">${prog}</td>`;

        jenjangs.forEach((j, idx) => {
          const val = data.filter(d => d.program === prog && d.jenjang === j).reduce((s, d) => s + d.totalCMB, 0);
          pSum += val;
          jenjangTotals[idx] += val;
          htmlContainer += `<td class="p-2 border border-slate-200">${val}</td>`;
        });

        htmlContainer += `<td class="p-2 border border-slate-200 font-bold bg-amber-50">${pSum}</td></tr>`;
      });

      htmlContainer += `
                <tr class="bg-blue-900 text-white font-bold text-base">
                  <td class="p-3 border border-blue-950 text-left">TOTAL</td>`;
      jenjangTotals.forEach(tot => {
        htmlContainer += `<td class="p-3 border border-blue-950">${tot}</td>`;
      });
      htmlContainer += `<td class="p-3 border border-blue-950 bg-amber-400 text-slate-900 font-extrabold">${totalCMB}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>`;

      // 2. TABEL MATRIKS DETAIL DIBAGI PER UNIT & JENJANG (GAYA TABEL KUNING)
      units.forEach(unit => {
        const unitJenjangs = [...new Set(data.filter(d => d.unit === unit).map(d => d.jenjang))];

        unitJenjangs.forEach(jenj => {
          const filteredItems = data.filter(d => d.unit === unit && d.jenjang === jenj);
          const itemPrograms = [...new Set(filteredItems.map(d => d.program))];
          let subtotalJenjang = 0;

          htmlContainer += `
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              <div class="bg-blue-900 text-white font-bold text-sm py-2 px-4 rounded-t-lg">
                REKAP CMB ${unit.toUpperCase()} - JENJANG ${jenj.toUpperCase()}
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse border border-slate-200 text-xs md:text-sm">
                  <thead>
                    <tr class="bg-amber-300 font-bold text-slate-900">
                      <th class="p-2.5 border border-slate-300 text-left">Program</th>
                      <th class="p-2.5 border border-slate-300 w-32">Jumlah CMB</th>
                    </tr>
                  </thead>
                  <tbody>`;

          itemPrograms.forEach(prog => {
            const val = filteredItems.filter(d => d.program === prog).reduce((s, d) => s + d.totalCMB, 0);
            subtotalJenjang += val;

            htmlContainer += `
              <tr class="hover:bg-slate-50">
                <td class="p-2 border border-slate-200 font-medium text-left">${prog}</td>
                <td class="p-2 border border-slate-200">${val}</td>
              </tr>`;
          });

          htmlContainer += `
                    <tr class="bg-amber-300 font-bold text-slate-900">
                      <td class="p-2.5 border border-slate-300 text-left">JUMLAH (${jenj})</td>
                      <td class="p-2.5 border border-slate-300 bg-amber-400 text-base">${subtotalJenjang}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>`;
        });
      });

      document.getElementById('dynamicTableContainer').innerHTML = htmlContainer;

      // Render Pie Chart
      renderPieChart(jenjangs, jenjangTotals, ['#2563EB', '#16A34A', '#EA580C', '#9333EA', '#CA8A04']);
    }

    // --- MENU 3: REKAPITULASI MURID ---
    function renderRekapMurid() {
      document.getElementById('filterLabel').textContent = "Filter Sumber:";
      document.getElementById('chartTitle').textContent = "📊 Distribusi Murid per Jenjang";

      const programList = ['DLP', 'DL', 'DLT', 'INK', 'KOM', 'KOP', 'KOR'];

      const sections = [
        {
          sumber: 'Homeschooling Kak Seto',
          title: 'HOMESCHOOLING KAK SETO',
          jenjangs: [
            { name: 'SD', rows: [{ class: '1', rowIdx: 10 }, { class: '2', rowIdx: 11 }, { class: '3', rowIdx: 12 }, { class: '4', rowIdx: 13 }, { class: '5', rowIdx: 14 }, { class: '6', rowIdx: 15 }], progStartCol: 29 },
            { name: 'SMP', rows: [{ class: '7', rowIdx: 28 }, { class: '8', rowIdx: 29 }, { class: '9', rowIdx: 30 }], progStartCol: 29 },
            { name: 'SMA / PAKET C', rows: [{ class: '10', rowIdx: 43 }, { class: '11', rowIdx: 44 }, { class: '12', rowIdx: 45 }], progStartCol: 29 }
          ]
        },
        {
          sumber: 'Kak Seto School',
          title: 'KAK SETO SCHOOL',
          jenjangs: [
            { name: 'SD', rows: [{ class: '1', rowIdx: 10 }, { class: '2', rowIdx: 11 }, { class: '3', rowIdx: 12 }, { class: '4', rowIdx: 13 }, { class: '5', rowIdx: 14 }, { class: '6', rowIdx: 15 }], progStartCol: 41 },
            { name: 'SMP', rows: [{ class: '7', rowIdx: 28 }, { class: '8', rowIdx: 29 }, { class: '9', rowIdx: 30 }], progStartCol: 41 }
          ]
        }
      ];

      populateFilter([
        { sumber: 'Homeschooling Kak Seto' },
        { sumber: 'Kak Seto School' }
      ], 'sumber');

      const selectedSumber = document.getElementById('csFilter').value;
      const filteredSections = (selectedSumber === 'ALL') ? sections : sections.filter(s => s.sumber === selectedSumber);

      let htmlContent = '';
      let overallTotal = 0;
      let jenjangSummaryMap = {};
      let programSummaryMap = { 'DLP':0, 'DL':0, 'DLT':0, 'INK':0, 'KOM':0, 'KOP':0, 'KOR':0 };

      filteredSections.forEach(sec => {
        sec.jenjangs.forEach(j => {
          let jenjangTotal = 0;
          let progTotals = Array(programList.length).fill(0);

          htmlContent += `
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              <div class="bg-blue-900 text-white font-bold text-sm py-2 px-4 rounded-t-lg">
                ${sec.title} - ${j.name}
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse border border-slate-200 text-xs md:text-sm">
                  <thead>
                    <tr class="bg-amber-300 font-bold text-slate-900">
                      <th class="p-2 border border-slate-300 w-20">Kelas</th>
                      ${programList.map(p => `<th class="p-2 border border-slate-300">${p}</th>`).join('')}
                      <th class="p-2 border border-slate-300 bg-amber-400">TOTAL</th>
                    </tr>
                  </thead>
                  <tbody>`;

          j.rows.forEach(r => {
            const rawRow = rawRows[r.rowIdx]?.c;
            let rowSum = 0;

            htmlContent += `<tr class="hover:bg-slate-50"><td class="p-2 border border-slate-200 font-bold">${r.class}</td>`;

            programList.forEach((p, idx) => {
              const val = Number(rawRow?.[j.progStartCol + idx]?.v) || 0;
              rowSum += val;
              progTotals[idx] += val;
              programSummaryMap[p] += val;
              htmlContent += `<td class="p-2 border border-slate-200">${val}</td>`;
            });

            jenjangTotal += rowSum;
            htmlContent += `<td class="p-2 border border-slate-200 font-bold bg-amber-50">${rowSum}</td></tr>`;
          });

          htmlContent += `
                    <tr class="bg-amber-300 font-bold text-slate-900">
                      <td class="p-2 border border-slate-300">JUMLAH</td>`;
          progTotals.forEach(pt => {
            htmlContent += `<td class="p-2 border border-slate-300">${pt}</td>`;
          });
          htmlContent += `<td class="p-2 border border-slate-300 bg-amber-400 text-base">${jenjangTotal}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>`;

          overallTotal += jenjangTotal;
          jenjangSummaryMap[j.name] = (jenjangSummaryMap[j.name] || 0) + jenjangTotal;
        });
      });

      let summaryTableHTML = `
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="bg-emerald-700 text-white font-bold text-sm py-2 px-4 rounded-t-lg">
            REKAP PER PROGRAM (SELURUH JENJANG)
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-center border-collapse border border-slate-200 text-sm">
              <thead>
                <tr class="bg-blue-900 text-white font-bold">
                  <th class="p-2.5 border border-blue-950 text-left">Program</th>
                  ${Object.keys(jenjangSummaryMap).map(j => `<th class="p-2.5 border border-blue-950">${j}</th>`).join('')}
                  <th class="p-2.5 border border-blue-950 bg-blue-950">TOTAL</th>
                </tr>
              </thead>
              <tbody>`;

      programList.forEach(p => {
        summaryTableHTML += `<tr class="hover:bg-slate-50"><td class="p-2 border border-slate-200 font-bold text-left bg-slate-50">${p}</td>`;
        let pTotal = 0;
        Object.keys(jenjangSummaryMap).forEach(j => {
          let pVal = 0;
          filteredSections.forEach(sec => {
            const jenjObj = sec.jenjangs.find(item => item.name === j);
            if (jenjObj) {
              jenjObj.rows.forEach(r => {
                const pIdx = programList.indexOf(p);
                pVal += Number(rawRows[r.rowIdx]?.c?.[jenjObj.progStartCol + pIdx]?.v) || 0;
              });
            }
          });
          pTotal += pVal;
          summaryTableHTML += `<td class="p-2 border border-slate-200">${pVal}</td>`;
        });
        summaryTableHTML += `<td class="p-2 border border-slate-200 font-bold bg-amber-50">${pTotal}</td></tr>`;
      });

      summaryTableHTML += `
                <tr class="bg-blue-900 text-white font-bold text-base">
                  <td class="p-3 border border-blue-950 text-left">TOTAL</td>`;
      Object.keys(jenjangSummaryMap).forEach(j => {
        summaryTableHTML += `<td class="p-3 border border-blue-950">${jenjangSummaryMap[j]}</td>`;
      });
      summaryTableHTML += `<td class="p-3 border border-blue-950 bg-amber-400 text-slate-900 font-extrabold">${overallTotal}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>`;

      document.getElementById('metricsContainer').innerHTML = `
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-purple-500">
          <p class="text-sm font-medium text-slate-500">Total Keseluruhan Murid</p>
          <p class="text-3xl font-bold text-slate-900 mt-2">${overallTotal.toLocaleString('id-ID')}</p>
        </div>
      `;

      document.getElementById('dynamicTableContainer').innerHTML = summaryTableHTML + htmlContent;

      renderPieChart(
        Object.keys(jenjangSummaryMap),
        Object.values(jenjangSummaryMap),
        ['#2563EB', '#16A34A', '#EA580C', '#9333EA']
      );
    }

    // --- UTILITIES ---
    function isJuly(dateStr) {
      if (!dateStr) return false;
      const str = String(dateStr).toLowerCase();
      return str.includes('juli') || str.includes('jul') || str.includes('/07/') || str.includes('-07-');
    }

    function populateFilter(data, keyName) {
      const select = document.getElementById('csFilter');
      const currentVal = select.value;
      const set = new Set(data.map(item => item[keyName]).filter(val => val && val !== '-'));
      
      select.innerHTML = '<option value="ALL">Semua Data</option>';
      set.forEach(item => {
        const option = document.createElement('option');
        option.value = item;
        option.textContent = item;
        select.appendChild(option);
      });

      if (set.has(currentVal)) select.value = currentVal;
    }

    function renderPieChart(labels, dataValues, colors) {
      const ctx = document.getElementById('mainChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: colors,
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                font: { size: 12 },
                padding: 16
              }
            }
          }
        }
      });
    }

    document.getElementById('csFilter').addEventListener('change', renderCurrentMenu);

    fetchData();
    setInterval(fetchData, 180000);
  </script>
</body>
</html>
