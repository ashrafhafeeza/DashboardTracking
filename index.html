<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Tracking CS SKS - Multi Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-6">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- CONTAINER LOGO SEKOLAH KAK SETO -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-center items-center overflow-hidden">
      <img src="img/logo-kakseto.jpeg" alt="Logo Sekolah Kak Seto" class="h-48 md:h-64 w-auto object-contain max-w-full" onerror="this.onerror=null; this.src='https://dummyimage.com/600x200/ffffff/ed1c24&text=SEKOLAH+KAK+SETO';">
    </div>
    
    <!-- HEADER DASHBOARD & FILTER PERIODE -->
    <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl font-bold text-slate-900">Dashboard Tracking CS SKS</h1>
          <span id="activePeriodeBadge" class="bg-blue-100 text-blue-700 text-xs font-semibold px-2.5 py-1 rounded-full">Bulan: Juli | Tahun: Semua</span>
        </div>
        <p class="text-slate-500 text-sm mt-1">Real-time update dari Google Sheets Sekolah Kak Seto</p>
      </div>
      
      <!-- WRAPPER FILTER -->
      <div class="flex flex-wrap gap-3 items-center">
        <!-- FILTER BULAN -->
        <div class="flex items-center gap-1.5">
          <label for="monthFilter" class="text-xs font-medium text-slate-600">Bulan:</label>
          <select id="monthFilter" onchange="renderCurrentMenu()" class="bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="ALL">Semua Bulan</option>
            <option value="01">Januari</option>
            <option value="02">Februari</option>
            <option value="03">Maret</option>
            <option value="04">April</option>
            <option value="05">Mei</option>
            <option value="06">Juni</option>
            <option value="07" selected>Juli</option>
            <option value="08">Agustus</option>
            <option value="09">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Desember</option>
          </select>
        </div>

        <!-- FILTER TAHUN -->
        <div class="flex items-center gap-1.5">
          <label for="yearFilter" class="text-xs font-medium text-slate-600">Tahun:</label>
          <select id="yearFilter" onchange="renderCurrentMenu()" class="bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="ALL" selected>Semua Tahun</option>
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
          </select>
        </div>

        <!-- FILTER SPESIFIK MENU (CS/UNIT/SUMBER) -->
        <div class="flex items-center gap-1.5">
          <label for="csFilter" id="filterLabel" class="text-xs font-medium text-slate-600">Filter CS:</label>
          <select id="csFilter" class="bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="ALL">Semua Data</option>
          </select>
        </div>

        <button onclick="fetchData()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg text-sm font-medium transition">
          🔄 Sync Data
        </button>
      </div>
    </header>

    <!-- NAVIGASI MENU TAB -->
    <div class="flex border-b border-slate-200 bg-white rounded-xl p-1 shadow-sm gap-1">
      <button onclick="switchTab('report_leads')" id="tab-report_leads" class="tab-btn flex-1 py-2.5 px-4 text-center rounded-lg font-medium text-sm transition bg-blue-600 text-white shadow">
        1. Report Leads
      </button>
      <button onclick="switchTab('rekap_cmb')" id="tab-rekap_cmb" class="tab-btn flex-1 py-2.5 px-4 text-center rounded-lg font-medium text-sm transition text-slate-600 hover:bg-slate-100">
        2. Rekapitulasi CMB
      </button>
      <button onclick="switchTab('rekap_murid')" id="tab-rekap_murid" class="tab-btn flex-1 py-2.5 px-4 text-center rounded-lg font-medium text-sm transition text-slate-600 hover:bg-slate-100">
        3. Rekapitulasi Murid
      </button>
    </div>

    <!-- METRICS CARD CONTAINER -->
    <div id="metricsContainer" class="grid grid-cols-2 md:grid-cols-5 gap-4">
      <!-- Kartu Metrik Diisi Dinamis Lewat JS -->
    </div>

    <!-- GRAFIK PIE -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 id="chartTitle" class="text-lg font-semibold mb-4">📊 Persentase & Distribusi Data</h2>
      <div class="relative h-80 w-full flex justify-center items-center">
        <canvas id="mainChart"></canvas>
      </div>
    </div>

    <!-- CONTAINER TABEL DINAMIS -->
    <div id="dynamicTableContainer" class="space-y-6">
      <!-- Diisi oleh JS -->
    </div>

  </div>

  <script>
    const SPREADSHEET_ID = '1QoN0mdOEU_E3oxbMkaSI_D6zSwyWRPhsaQj0tLMO8bQ';
    const GID = '1081523478';
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json;responseHandler:handleGoogleResponse&gid=${GID}`;

    let rawRows = [];
    let currentTab = 'report_leads';
    let chartInstance = null;

    const MONTH_NAMES = {
      '01': 'Januari', '02': 'Februari', '03': 'Maret', '04': 'April',
      '05': 'Mei', '06': 'Juni', '07': 'Juli', '08': 'Agustus',
      '09': 'September', '10': 'Oktober', '11': 'November', '12': 'Desember'
    };

    function fetchData() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = GVIZ_URL;
        script.onerror = () => reject(new Error('Google Sheets tidak dapat diakses.'));

        window.handleGoogleResponse = (json) => {
          try {
            if (json.status !== 'ok') throw new Error('Respons Google Sheets tidak valid.');
            rawRows = json.table.rows;
            renderCurrentMenu();
            resolve();
          } catch (err) {
            reject(err);
          } finally {
            script.remove();
          }
        };

        document.head.appendChild(script);
      }).catch((err) => {
        console.error("Gagal mengambil data:", err);
        document.getElementById('dynamicTableContainer').innerHTML =
          `<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center text-red-500 font-semibold">Gagal terhubung: ${err.message}</div>`;
      });
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white', 'shadow');
        btn.classList.add('text-slate-600', 'hover:bg-slate-100');
      });

      const activeBtn = document.getElementById(`tab-${tabName}`);
      activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow');
      activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');

      renderCurrentMenu();
    }

    function renderCurrentMenu() {
      if (!rawRows || rawRows.length === 0) return;
      updateBadgeHeader();

      if (currentTab === 'report_leads') {
        renderReportLeads();
      } else if (currentTab === 'rekap_cmb') {
        renderRekapCMB();
      } else if (currentTab === 'rekap_murid') {
        renderRekapMurid();
      }
    }

    function updateBadgeHeader() {
      const selectedMonth = document.getElementById('monthFilter').value;
      const selectedYear = document.getElementById('yearFilter').value;
      
      const monthText = selectedMonth === 'ALL' ? 'Semua Bulan' : MONTH_NAMES[selectedMonth];
      const yearText = selectedYear === 'ALL' ? 'Semua Tahun' : selectedYear;

      document.getElementById('activePeriodeBadge').textContent = `Bulan: ${monthText} | Tahun: ${yearText}`;
    }

    // Helper Filter Tanggal (Bulan & Tahun)
    function filterByDate(dateStr) {
      const selectedMonth = document.getElementById('monthFilter').value;
      const selectedYear = document.getElementById('yearFilter').value;

      if (selectedMonth === 'ALL' && selectedYear === 'ALL') return true;
      if (!dateStr) return false;

      const str = String(dateStr).toLowerCase();

      // Cek pencocokan bulan
      let monthMatch = (selectedMonth === 'ALL');
      if (!monthMatch) {
        const monthName = MONTH_NAMES[selectedMonth].toLowerCase();
        const monthShort = monthName.substring(0, 3);
        const monthNumStr = `/${selectedMonth}/`;
        const monthDashStr = `-${selectedMonth}-`;

        if (str.includes(monthName) || str.includes(monthShort) || str.includes(monthNumStr) || str.includes(monthDashStr)) {
          monthMatch = true;
        }
      }

      // Cek pencocokan tahun
      let yearMatch = (selectedYear === 'ALL');
      if (!yearMatch) {
        if (str.includes(selectedYear)) {
          yearMatch = true;
        }
      }

      return monthMatch && yearMatch;
    }

    function parseCellNum(cell) {
      if (!cell || cell.v === null || cell.v === undefined) return 0;
      const num = Number(cell.v);
      return isNaN(num) ? 0 : num;
    }

    // --- MENU 1: REPORT LEADS ---
    function renderReportLeads() {
      document.getElementById('filterLabel').textContent = "Filter CS:";
      document.getElementById('chartTitle').textContent = "📊 Distribusi Status Leads (Kolom F - K)";
      let data = [];
      let currentDate = '';

      for (let i = 0; i < rawRows.length; i++) {
        const c = rawRows[i].c;
        if (!c || !c[1]) continue;

        if (c[0]) currentDate = c[0].f || c[0].v || currentDate;
        const dateVal = currentDate;
        const namaCS = String(c[1].v || '-').trim();

        if (filterByDate(dateVal)) {
          data.push({
            tanggal: dateVal,
            namaCS: namaCS,
            newLeads: parseCellNum(c[2]),       // Col C
            existingLeads: parseCellNum(c[3]),  // Col D
            totalLeads: parseCellNum(c[4]),     // Col E
            callIn: parseCellNum(c[5]),         // Col F
            potensial: parseCellNum(c[6]),      // Col G
            closingForm: parseCellNum(c[7]),    // Col H
            tidakPotensial: parseCellNum(c[8]), // Col I
            kuotaFull: parseCellNum(c[9]),      // Col J
            closingUP: parseCellNum(c[10])      // Col K
          });
        }
      }

      populateFilter(data, 'namaCS');
      const selectedCS = document.getElementById('csFilter').value;
      const filteredData = (selectedCS === 'ALL') ? data : data.filter(d => d.namaCS === selectedCS);

      const sumNew = filteredData.reduce((s, d) => s + d.newLeads, 0);
      const sumExist = filteredData.reduce((s, d) => s + d.existingLeads, 0);
      const sumTotalLeads = filteredData.reduce((s, d) => s + d.totalLeads, 0);
      const sumCallIn = filteredData.reduce((s, d) => s + d.callIn, 0);
      const sumPot = filteredData.reduce((s, d) => s + d.potensial, 0);
      const sumCloseForm = filteredData.reduce((s, d) => s + d.closingForm, 0);
      const sumTidakPot = filteredData.reduce((s, d) => s + d.tidakPotensial, 0);
      const sumFull = filteredData.reduce((s, d) => s + d.kuotaFull, 0);
      const sumCloseUP = filteredData.reduce((s, d) => s + d.closingUP, 0);
      const sumStatusTotal = sumCallIn + sumPot + sumCloseForm + sumTidakPot + sumFull + sumCloseUP;

      document.getElementById('metricsContainer').innerHTML = `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-blue-500">
          <p class="text-xs font-medium text-slate-500">New Leads</p>
          <p class="text-2xl font-bold text-slate-900 mt-1">${sumNew.toLocaleString('id-ID')}</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-cyan-500">
          <p class="text-xs font-medium text-slate-500">Existing Leads</p>
          <p class="text-2xl font-bold text-slate-900 mt-1">${sumExist.toLocaleString('id-ID')}</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-indigo-600 bg-indigo-50/30">
          <p class="text-xs font-bold text-indigo-700">TOTAL LEADS (C+D)</p>
          <p class="text-2xl font-bold text-indigo-900 mt-1">${sumTotalLeads.toLocaleString('id-ID')}</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-sky-400">
          <p class="text-xs font-medium text-slate-500">Call In</p>
          <p class="text-2xl font-bold text-slate-900 mt-1">${sumCallIn.toLocaleString('id-ID')}</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-amber-500">
          <p class="text-xs font-medium text-slate-500">Potensial</p>
          <p class="text-2xl font-bold text-slate-900 mt-1">${sumPot.toLocaleString('id-ID')}</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-emerald-500">
          <p class="text-xs font-medium text-slate-500">Closing Form</p>
          <p class="text-2xl font-bold text-slate-900 mt-1">${sumCloseForm.toLocaleString('id-ID')}</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-rose-500">
          <p class="text-xs font-medium text-slate-500">Tidak Potensial</p>
          <p class="text-2xl font-bold text-slate-900 mt-1">${sumTidakPot.toLocaleString('id-ID')}</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-slate-500">
          <p class="text-xs font-medium text-slate-500">Kuota Full</p>
          <p class="text-2xl font-bold text-slate-900 mt-1">${sumFull.toLocaleString('id-ID')}</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-purple-500">
          <p class="text-xs font-medium text-slate-500">Closing UP</p>
          <p class="text-2xl font-bold text-slate-900 mt-1">${sumCloseUP.toLocaleString('id-ID')}</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-teal-600 bg-teal-50/30">
          <p class="text-xs font-bold text-teal-700">TOTAL STATUS (F..K)</p>
          <p class="text-2xl font-bold text-teal-900 mt-1">${sumStatusTotal.toLocaleString('id-ID')}</p>
        </div>
      `;

      let tableHTML = `
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <h2 class="text-lg font-bold mb-4 text-slate-900">📋 Detail Laporan Leads (Sesuai Google Sheets)</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-center border-collapse text-xs md:text-sm">
              <thead>
                <tr class="bg-blue-900 text-white font-semibold">
                  <th class="p-3 border border-blue-950 text-left">Tanggal</th>
                  <th class="p-3 border border-blue-950 text-left">Nama CS</th>
                  <th class="p-3 border border-blue-950 bg-blue-800">New Leads</th>
                  <th class="p-3 border border-blue-950 bg-blue-800">Existing</th>
                  <th class="p-3 border border-blue-950 bg-blue-950 font-bold text-amber-300">Total Leads</th>
                  <th class="p-3 border border-blue-950">Call In</th>
                  <th class="p-3 border border-blue-950">Potensial</th>
                  <th class="p-3 border border-blue-950">Closing Form</th>
                  <th class="p-3 border border-blue-950">Tidak Potensial</th>
                  <th class="p-3 border border-blue-950">Kuota Full</th>
                  <th class="p-3 border border-blue-950">Closing UP</th>
                  <th class="p-3 border border-blue-950 bg-blue-950 font-bold text-emerald-300">Total Status</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">`;

      filteredData.forEach(item => {
        const rowStatusTotal = item.callIn + item.potensial + item.closingForm + item.tidakPotensial + item.kuotaFull + item.closingUP;
        tableHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-2.5 border border-slate-200 text-left text-slate-600 font-medium">${item.tanggal}</td>
            <td class="p-2.5 border border-slate-200 text-left font-semibold text-slate-900">${item.namaCS}</td>
            <td class="p-2.5 border border-slate-200">${item.newLeads}</td>
            <td class="p-2.5 border border-slate-200">${item.existingLeads}</td>
            <td class="p-2.5 border border-slate-200 font-bold bg-blue-50 text-blue-700">${item.totalLeads}</td>
            <td class="p-2.5 border border-slate-200">${item.callIn}</td>
            <td class="p-2.5 border border-slate-200 font-medium text-amber-600">${item.potensial}</td>
            <td class="p-2.5 border border-slate-200 font-medium text-emerald-600">${item.closingForm}</td>
            <td class="p-2.5 border border-slate-200 text-rose-600">${item.tidakPotensial}</td>
            <td class="p-2.5 border border-slate-200 text-slate-500">${item.kuotaFull}</td>
            <td class="p-2.5 border border-slate-200 font-medium text-purple-600">${item.closingUP}</td>
            <td class="p-2.5 border border-slate-200 font-bold bg-emerald-50 text-emerald-700">${rowStatusTotal}</td>
          </tr>`;
      });

      tableHTML += `
          <tr class="bg-amber-300 font-bold text-slate-900 text-sm">
            <td class="p-3 border border-amber-400 text-left" colspan="2">TOTAL KESELURUHAN</td>
            <td class="p-3 border border-amber-400">${sumNew}</td>
            <td class="p-3 border border-amber-400">${sumExist}</td>
            <td class="p-3 border border-amber-400 bg-amber-400 text-blue-900 text-base font-extrabold">${sumTotalLeads}</td>
            <td class="p-3 border border-amber-400">${sumCallIn}</td>
            <td class="p-3 border border-amber-400">${sumPot}</td>
            <td class="p-3 border border-amber-400">${sumCloseForm}</td>
            <td class="p-3 border border-amber-400">${sumTidakPot}</td>
            <td class="p-3 border border-amber-400">${sumFull}</td>
            <td class="p-3 border border-amber-400">${sumCloseUP}</td>
            <td class="p-3 border border-amber-400 bg-emerald-400 text-slate-900 text-base font-extrabold">${sumStatusTotal}</td>
          </tr>
        </tbody></table></div></div>`;
      
      document.getElementById('dynamicTableContainer').innerHTML = tableHTML;

      renderPieChart(
        ['Call In', 'Potensial', 'Closing Form', 'Tidak Potensial', 'Kuota Full', 'Closing UP'],
        [sumCallIn, sumPot, sumCloseForm, sumTidakPot, sumFull, sumCloseUP],
        ['#38BDF8', '#F59E0B', '#10B981', '#EF4444', '#64748B', '#A855F7']
      );
    }

    // --- MENU 2: REKAPITULASI CMB ---
    function renderRekapCMB() {
      document.getElementById('filterLabel').textContent = "Filter Unit:";
      document.getElementById('chartTitle').textContent = "📊 Distribusi CMB Per Jenjang";
      
      let rawData = [];
      let currentUnit = '';
      let currentJenjang = '';

      for (let i = 1; i < rawRows.length; i++) {
        const c = rawRows[i].c;
        if (!c) continue;

        if (c[15]?.v) currentUnit = String(c[15].v).trim();
        if (c[16]?.v) currentJenjang = String(c[16].v).trim();
        if (!c[17] || !c[18]) continue;
        const program = String(c[17].v || '').trim();
        const total = parseCellNum(c[18]);
        const dateVal = c[0] ? (c[0].f || c[0].v || '') : '';

        if (program && program !== 'Program' && program !== 'Jumlah') {
          if (filterByDate(dateVal)) {
            rawData.push({
              unit: currentUnit || 'Umum',
              jenjang: currentJenjang || 'Lainnya',
              program,
              totalCMB: total
            });
          }
        }
      }

      populateFilter(rawData, 'unit');
      const selectedUnit = document.getElementById('csFilter').value;
      const data = (selectedUnit === 'ALL') ? rawData : rawData.filter(d => d.unit === selectedUnit);

      const totalCMB = data.reduce((s, d) => s + d.totalCMB, 0);
      const units = [...new Set(data.map(d => d.unit))];
      const jenjangs = [...new Set(data.map(d => d.jenjang))];
      const programs = [...new Set(data.map(d => d.program))];

      document.getElementById('metricsContainer').innerHTML = `
        <div class="col-span-2 md:col-span-5 bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-green-500">
          <p class="text-sm font-medium text-slate-500">Total Rekapitulasi CMB</p>
          <p class="text-3xl font-bold text-slate-900 mt-2">${totalCMB.toLocaleString('id-ID')}</p>
        </div>
      `;

      let htmlContainer = '';

      htmlContainer += `
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="bg-emerald-700 text-white font-bold text-sm py-2 px-4 rounded-t-lg">
            REKAP CMB PER PROGRAM (SELURUH JENJANG)
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-center border-collapse border border-slate-200 text-sm">
              <thead>
                <tr class="bg-blue-900 text-white font-bold">
                  <th class="p-2.5 border border-blue-950 text-left">Program</th>
                  ${jenjangs.map(j => `<th class="p-2.5 border border-blue-950">${j}</th>`).join('')}
                  <th class="p-2.5 border border-blue-950 bg-blue-950">TOTAL</th>
                </tr>
              </thead>
              <tbody>`;

      let jenjangTotals = Array(jenjangs.length).fill(0);

      programs.forEach(prog => {
        let pSum = 0;
        htmlContainer += `<tr class="hover:bg-slate-50"><td class="p-2 border border-slate-200 font-bold text-left bg-slate-50">${prog}</td>`;

        jenjangs.forEach((j, idx) => {
          const val = data.filter(d => d.program === prog && d.jenjang === j).reduce((s, d) => s + d.totalCMB, 0);
          pSum += val;
          jenjangTotals[idx] += val;
          htmlContainer += `<td class="p-2 border border-slate-200">${val}</td>`;
        });

        htmlContainer += `<td class="p-2 border border-slate-200 font-bold bg-amber-50">${pSum}</td></tr>`;
      });

      htmlContainer += `
                <tr class="bg-blue-900 text-white font-bold text-base">
                  <td class="p-3 border border-blue-950 text-left">TOTAL</td>`;
      jenjangTotals.forEach(tot => {
        htmlContainer += `<td class="p-3 border border-blue-950">${tot}</td>`;
      });
      htmlContainer += `<td class="p-3 border border-blue-950 bg-amber-400 text-slate-900 font-extrabold">${totalCMB}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>`;

      units.forEach(unit => {
        const unitJenjangs = [...new Set(data.filter(d => d.unit === unit).map(d => d.jenjang))];

        unitJenjangs.forEach(jenj => {
          const filteredItems = data.filter(d => d.unit === unit && d.jenjang === jenj);
          const itemPrograms = [...new Set(filteredItems.map(d => d.program))];
          let subtotalJenjang = 0;

          htmlContainer += `
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              <div class="bg-blue-900 text-white font-bold text-sm py-2 px-4 rounded-t-lg">
                REKAP CMB ${unit.toUpperCase()} - JENJANG ${jenj.toUpperCase()}
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse border border-slate-200 text-xs md:text-sm">
                  <thead>
                    <tr class="bg-amber-300 font-bold text-slate-900">
                      <th class="p-2.5 border border-slate-300 text-left">Program</th>
                      <th class="p-2.5 border border-slate-300 w-32">Jumlah CMB</th>
                    </tr>
                  </thead>
                  <tbody>`;

          itemPrograms.forEach(prog => {
            const val = filteredItems.filter(d => d.program === prog).reduce((s, d) => s + d.totalCMB, 0);
            subtotalJenjang += val;

            htmlContainer += `
              <tr class="hover:bg-slate-50">
                <td class="p-2 border border-slate-200 font-medium text-left">${prog}</td>
                <td class="p-2 border border-slate-200">${val}</td>
              </tr>`;
          });

          htmlContainer += `
                    <tr class="bg-amber-300 font-bold text-slate-900">
                      <td class="p-2.5 border border-slate-300 text-left">JUMLAH (${jenj})</td>
                      <td class="p-2.5 border border-slate-300 bg-amber-400 text-base">${subtotalJenjang}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>`;
        });
      });

      document.getElementById('dynamicTableContainer').innerHTML = htmlContainer;
      renderPieChart(jenjangs, jenjangTotals, ['#2563EB', '#16A34A', '#EA580C', '#9333EA', '#CA8A04']);
    }

    // --- MENU 3: REKAPITULASI MURID ---
    function renderRekapMurid() {
      document.getElementById('filterLabel').textContent = "Filter Sumber:";
      document.getElementById('chartTitle').textContent = "📊 Distribusi Murid per Jenjang";

      const programList = ['DLP', 'DL', 'DLT', 'INK', 'KOM', 'KOP', 'KOR'];

      const sections = [
        {
          sumber: 'Homeschooling Kak Seto',
          title: 'HOMESCHOOLING KAK SETO',
          jenjangs: [
            { name: 'SD', rows: [{ class: '1', rowIdx: 10 }, { class: '2', rowIdx: 11 }, { class: '3', rowIdx: 12 }, { class: '4', rowIdx: 13 }, { class: '5', rowIdx: 14 }, { class: '6', rowIdx: 15 }], progStartCol: 29 },
            { name: 'SMP', rows: [{ class: '7', rowIdx: 28 }, { class: '8', rowIdx: 29 }, { class: '9', rowIdx: 30 }], progStartCol: 29 },
            { name: 'SMA / PAKET C', rows: [{ class: '10', rowIdx: 43 }, { class: '11', rowIdx: 44 }, { class: '12', rowIdx: 45 }], progStartCol: 29 }
          ]
        },
        {
          sumber: 'Kak Seto School',
          title: 'KAK SETO SCHOOL',
          jenjangs: [
            { name: 'SD', rows: [{ class: '1', rowIdx: 10 }, { class: '2', rowIdx: 11 }, { class: '3', rowIdx: 12 }, { class: '4', rowIdx: 13 }, { class: '5', rowIdx: 14 }, { class: '6', rowIdx: 15 }], progStartCol: 41 },
            { name: 'SMP', rows: [{ class: '7', rowIdx: 28 }, { class: '8', rowIdx: 29 }, { class: '9', rowIdx: 30 }], progStartCol: 41 }
          ]
        }
      ];

      populateFilter([
        { sumber: 'Homeschooling Kak Seto' },
        { sumber: 'Kak Seto School' }
      ], 'sumber');

      const selectedSumber = document.getElementById('csFilter').value;
      const filteredSections = (selectedSumber === 'ALL') ? sections : sections.filter(s => s.sumber === selectedSumber);

      let htmlContent = '';
      let overallTotal = 0;
      let jenjangSummaryMap = {};

      filteredSections.forEach(sec => {
        sec.jenjangs.forEach(j => {
          let jenjangTotal = 0;
          let progTotals = Array(programList.length).fill(0);

          htmlContent += `
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              <div class="bg-blue-900 text-white font-bold text-sm py-2 px-4 rounded-t-lg">
                ${sec.title} - ${j.name}
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse border border-slate-200 text-xs md:text-sm">
                  <thead>
                    <tr class="bg-amber-300 font-bold text-slate-900">
                      <th class="p-2 border border-slate-300 w-20">Kelas</th>
                      ${programList.map(p => `<th class="p-2 border border-slate-300">${p}</th>`).join('')}
                      <th class="p-2 border border-slate-300 bg-amber-400">TOTAL</th>
                    </tr>
                  </thead>
                  <tbody>`;

          j.rows.forEach(r => {
            const rawRow = rawRows[r.rowIdx]?.c;
            const dateVal = rawRow?.[0] ? (rawRow[0].f || rawRow[0].v || '') : '';
            let rowSum = 0;

            const isDateMatched = filterByDate(dateVal);

            htmlContent += `<tr class="hover:bg-slate-50"><td class="p-2 border border-slate-200 font-bold">${r.class}</td>`;

            programList.forEach((p, idx) => {
              const val = isDateMatched ? parseCellNum(rawRow?.[j.progStartCol + idx]) : 0;
              rowSum += val;
              progTotals[idx] += val;
              htmlContent += `<td class="p-2 border border-slate-200">${val}</td>`;
            });

            jenjangTotal += rowSum;
            htmlContent += `<td class="p-2 border border-slate-200 font-bold bg-amber-50">${rowSum}</td></tr>`;
          });

          htmlContent += `
                    <tr class="bg-amber-300 font-bold text-slate-900">
                      <td class="p-2 border border-slate-300">JUMLAH</td>`;
          progTotals.forEach(pt => {
            htmlContent += `<td class="p-2 border border-slate-300">${pt}</td>`;
          });
          htmlContent += `<td class="p-2 border border-slate-300 bg-amber-400 text-base">${jenjangTotal}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>`;

          overallTotal += jenjangTotal;
          jenjangSummaryMap[j.name] = (jenjangSummaryMap[j.name] || 0) + jenjangTotal;
        });
      });

      let summaryTableHTML = `
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="bg-emerald-700 text-white font-bold text-sm py-2 px-4 rounded-t-lg">
            REKAP PER PROGRAM (SELURUH JENJANG)
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-center border-collapse border border-slate-200 text-sm">
              <thead>
                <tr class="bg-blue-900 text-white font-bold">
                  <th class="p-2.5 border border-blue-950 text-left">Program</th>
                  ${Object.keys(jenjangSummaryMap).map(j => `<th class="p-2.5 border border-blue-950">${j}</th>`).join('')}
                  <th class="p-2.5 border border-blue-950 bg-blue-950">TOTAL</th>
                </tr>
              </thead>
              <tbody>`;

      programList.forEach(p => {
        summaryTableHTML += `<tr class="hover:bg-slate-50"><td class="p-2 border border-slate-200 font-bold text-left bg-slate-50">${p}</td>`;
        let pTotal = 0;
        Object.keys(jenjangSummaryMap).forEach(j => {
          let pVal = 0;
          filteredSections.forEach(sec => {
            const jenjObj = sec.jenjangs.find(item => item.name === j);
            if (jenjObj) {
              jenjObj.rows.forEach(r => {
                const rawRow = rawRows[r.rowIdx]?.c;
                const dateVal = rawRow?.[0] ? (rawRow[0].f || rawRow[0].v || '') : '';
                if (filterByDate(dateVal)) {
                  const pIdx = programList.indexOf(p);
                  pVal += parseCellNum(rawRow?.[jenjObj.progStartCol + pIdx]);
                }
              });
            }
          });
          pTotal += pVal;
          summaryTableHTML += `<td class="p-2 border border-slate-200">${pVal}</td>`;
        });
        summaryTableHTML += `<td class="p-2 border border-slate-200 font-bold bg-amber-50">${pTotal}</td></tr>`;
      });

      summaryTableHTML += `
                <tr class="bg-blue-900 text-white font-bold text-base">
                  <td class="p-3 border border-blue-950 text-left">TOTAL</td>`;
      Object.keys(jenjangSummaryMap).forEach(j => {
        summaryTableHTML += `<td class="p-3 border border-blue-950">${jenjangSummaryMap[j]}</td>`;
      });
      summaryTableHTML += `<td class="p-3 border border-blue-950 bg-amber-400 text-slate-900 font-extrabold">${overallTotal}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>`;

      document.getElementById('metricsContainer').innerHTML = `
        <div class="col-span-2 md:col-span-5 bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-purple-500">
          <p class="text-sm font-medium text-slate-500">Total Keseluruhan Murid</p>
          <p class="text-3xl font-bold text-slate-900 mt-2">${overallTotal.toLocaleString('id-ID')}</p>
        </div>
      `;

      document.getElementById('dynamicTableContainer').innerHTML = summaryTableHTML + htmlContent;

      renderPieChart(
        Object.keys(jenjangSummaryMap),
        Object.values(jenjangSummaryMap),
        ['#2563EB', '#16A34A', '#EA580C', '#9333EA']
      );
    }

    // --- UTILITIES ---
    function populateFilter(data, keyName) {
      const select = document.getElementById('csFilter');
      const currentVal = select.value;
      const set = new Set(data.map(item => item[keyName]).filter(val => val && val !== '-'));
      
      select.innerHTML = '<option value="ALL">Semua Data</option>';
      set.forEach(item => {
        const option = document.createElement('option');
        option.value = item;
        option.textContent = item;
        select.appendChild(option);
      });

      if (set.has(currentVal)) select.value = currentVal;
    }

    function renderPieChart(labels, dataValues, colors) {
      const ctx = document.getElementById('mainChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: colors,
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { font: { size: 12 }, padding: 16 }
            }
          }
        }
      });
    }

    document.getElementById('csFilter').addEventListener('change', renderCurrentMenu);

    fetchData();
    setInterval(fetchData, 180000);
  </script>
</body>
